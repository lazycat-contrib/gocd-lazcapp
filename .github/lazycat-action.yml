version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/gocd.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gocd-server
build:
  run_buildscript: false
images:
  - id: gocd-server
    target: service
    service: gocd-server
    source: docker.io/gocd/gocd-server
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: GoCD
    summary: 开源的持续集成和持续交付服务器
