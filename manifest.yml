application:
  subdomain: gocd
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  upstreams:
    - location: /
      backend: http://gocd-server:8153/
  public_path:
    - /
services:
  gocd-server:
    user: 1000
    # upstream: docker.io/gocd/gocd-server:v26.2.0
    image: registry.lazycat.cloud/czyt/gocd/gocd-server:232f7e7c00d23611
    binds:
      - /lzcapp/var/godata:/godata
      - /lzcapp/var/home:/home/go
      - /lzcapp/var/config:/config
    setup_script: |
      chown -R 1000:1000 /lzcapp/var/godata
      chown -R 1000:1000 /lzcapp/var/home
      chown -R 1000:1000 /lzcapp/var/config
