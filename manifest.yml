lzc-sdk-version: "0.1"
name: GoCD
package: cloud.lazycat.app.gocd
version: 24.3.0
description: 一个开源的持续集成和持续交付系统
homepage: https://www.gocd.org/
author: gocd
application:
  subdomain: gocd
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  routes:
    - /=http://gocd-server.cloud.lazycat.app.gocd.lzcapp:8153/
  public_path:
    - /
services:
  gocd-server:
    user: 1000
    image: registry.lazycat.cloud/czyt/gocd/gocd-server:0e27c548f87b8820
    binds:
      - /lzcapp/var/godata:/godata
      - /lzcapp/var/home:/home/go 
      - /lzcapp/var/config:/config
    setup_script: |
      chown -R 1000:1000 /lzcapp/var/godata
      chown -R 1000:1000 /lzcapp/var/home
      chown -R 1000:1000 /lzcapp/var/config
unsupported_platforms:
  - ios
  - android
